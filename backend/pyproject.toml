[project]
name = "bookshelf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "fastapi[standard]>=0.121.3",
    "numpy>=2.0.2",
    "pydantic>=2.12.4",
    "sqlmodel>=0.0.27",
]

[project.optional-dependencies]
pi = [
    "adafruit-circuitpython-neopixel>=6.3.18",
    "rpi-gpio>=0.7.1",
    "rpi-ws281x>=5.0.0",
]
test = [
    "pytest>=8.2.0",
]
dev = [
    "neovim>=0.3.1",
    "pyright>=1.1.407",
    "ruff>=0.14.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# `bin/gpio_test.py` matches pytest's default `*_test.py` glob, and it drives real hardware at
# import time. Confine collection to `tests/` so `uv run pytest` from the backend root is safe.
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# "UP" (pyupgrade) keeps type hints on modern syntax: `T | None` over `Optional[T]`,
# builtin generics over `typing.List`, and ABCs imported from `collections.abc`.
extend-select = ["I", "UP"]
