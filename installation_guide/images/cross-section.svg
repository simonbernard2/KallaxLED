<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
  <title id="t">Side view of one box: strip on the rear edge of the board, facing the wall</title>
  <desc id="d">Side cross-section. The wall is on the left, the front of the shelf on the right. A strip is stuck to the rear edge of the board below the box, its LEDs pointing at the wall. A gap between wall and shelf lets the light spread into a soft glow.</desc>
  <rect width="760" height="380" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .small { font-size: 12px; }
    .label { font-size: 14px; font-weight: 600; }
    .title { font-size: 18px; font-weight: 700; }
    .ray { stroke: #bf8700; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8c959f" stroke-width="2"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2328"/></marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2328"/></marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" class="title">Side view of one box (wall on the left, front on the right)</text>

  <!-- wall -->
  <rect x="60" y="50" width="40" height="290" fill="url(#hatch)" stroke="#8c959f" stroke-width="2"/>
  <text x="80" y="360" text-anchor="middle" class="label">wall</text>

  <!-- glow on the wall -->
  <rect x="100" y="205" width="6" height="95" fill="#fff8c5"/>

  <!-- boards: top board (above the box) and bottom board (below the box); depth 39 cm drawn at 6 px per cm -->
  <rect x="124" y="70" width="234" height="14" fill="#d0d7de" stroke="#6e7781" stroke-width="2"/>
  <rect x="124" y="282" width="234" height="14" fill="#d0d7de" stroke="#6e7781" stroke-width="2"/>
  <text x="240" y="62" text-anchor="middle" class="small">board above the box</text>
  <text x="150" y="316" class="small">board below the box (the strip is stuck on its rear edge)</text>

  <!-- books -->
  <g fill="#ddf4ff" stroke="#0969da" stroke-width="1.5">
    <rect x="150" y="130" width="22" height="152"/><rect x="176" y="150" width="26" height="132"/><rect x="206" y="120" width="20" height="162"/><rect x="230" y="140" width="28" height="142"/>
  </g>
  <text x="205" y="105" text-anchor="middle" class="small">books in the box</text>

  <!-- strip on rear edge face (x 118..124), LEDs face the wall -->
  <rect x="118" y="284" width="6" height="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <circle cx="117" cy="289" r="3" fill="#bf8700"/>

  <!-- rays -->
  <g class="ray">
    <path d="M 117 289 L 102 289"/>
    <path d="M 117 289 L 102 268"/>
    <path d="M 117 289 L 102 250"/>
    <path d="M 117 289 L 102 310"/>
    <path d="M 117 289 L 102 325"/>
  </g>

  <!-- gap dimension -->
  <line x1="100" y1="340" x2="124" y2="340" stroke="#1f2328" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>
  <text x="112" y="358" text-anchor="middle" class="small">gap</text>

  <!-- callouts -->
  <g class="small">
    <rect x="400" y="60" width="330" height="108" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="414" y="82" class="label">How far from the wall?</text>
    <text x="414" y="104">Gap under 1 cm: bright dots on the wall</text>
    <text x="414" y="122">(one dot per LED, 3.3 cm apart).</text>
    <text x="414" y="144">Gap 3 to 5 cm: the dots blur into a soft glow.</text>
    <text x="414" y="162">A bare wall behind the books reflects best.</text>

    <rect x="400" y="190" width="330" height="120" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="414" y="212" class="label">Reading the picture</text>
    <text x="414" y="234">Yellow lines: light from one LED, pointing at the wall.</text>
    <text x="414" y="252">Yellow patch on the wall: where the glow lands.</text>
    <text x="414" y="270">The strip faces away from you, so you never see the</text>
    <text x="414" y="288">LEDs, only the light around the box.</text>
  </g>
</svg>
