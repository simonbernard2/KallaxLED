<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="t d">
  <title id="t">Wiring diagram: Pi, level shifter, resistor, capacitor, power supply and strip</title>
  <desc id="d">Raspberry Pi pin 12 (GPIO 18) goes to the input of a 74AHCT125 level shifter. The shifter output goes through a 470 ohm resistor to the strip's data-in pad. The 5 V supply feeds the strip and the level shifter through a fuse, with a 1000 microfarad capacitor across the strip's power. All grounds are joined.</desc>
  <rect width="820" height="520" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 13px; }
    .title { font-size: 18px; font-weight: 700; }
    .label { font-weight: 600; }
    .small { font-size: 12px; }
    .block { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; }
    .red { stroke: #cf222e; stroke-width: 3; fill: none; }
    .blk { stroke: #1f2328; stroke-width: 3; fill: none; }
    .grn { stroke: #1a7f37; stroke-width: 3; fill: none; }
    .part { fill: #ffffff; stroke: #1f2328; stroke-width: 2; }
  </style>

  <text x="410" y="28" text-anchor="middle" class="title">Final wiring for one strip row (row 1 shown)</text>

  <!-- Raspberry Pi -->
  <rect class="block" x="30" y="70" width="180" height="160" rx="8"/>
  <text x="120" y="96" text-anchor="middle" class="label">Raspberry Pi 4</text>
  <text x="200" y="114" text-anchor="end" class="small">pin 12 (GPIO 18)</text>
  <text x="200" y="204" text-anchor="end" class="small">pin 6 (GND)</text>
  <text x="120" y="150" text-anchor="middle" class="small">data out is 3.3 V</text>
  <line x1="120" y1="290" x2="120" y2="232" stroke="#57606a" stroke-width="2"/>
  <text x="120" y="308" text-anchor="middle" class="small">its own USB-C supply</text>
  <text x="120" y="324" text-anchor="middle" class="small">(not the strip's)</text>

  <!-- Level shifter -->
  <rect class="block" x="300" y="70" width="160" height="160" rx="8"/>
  <text x="380" y="92" text-anchor="middle" class="label">74AHCT125</text>
  <text x="380" y="108" text-anchor="middle" class="small">level shifter, 1 channel used</text>
  <text x="308" y="134" class="small">IN (pin 2)</text>
  <text x="308" y="158" class="small">OE (pin 1)</text>
  <text x="308" y="204" class="small">GND (pin 7)</text>
  <text x="452" y="134" text-anchor="end" class="small">OUT (pin 3)</text>
  <text x="452" y="174" text-anchor="end" class="small">VCC (pin 14)</text>
  <text x="380" y="246" text-anchor="middle" class="small">Pins 4, 5, 9, 10, 12, 13 also go to GND</text>

  <!-- Resistor -->
  <rect class="part" x="510" y="124" width="60" height="22"/>
  <text x="540" y="116" text-anchor="middle" class="small">470 &#937; resistor</text>

  <!-- Strip -->
  <rect class="block" x="650" y="70" width="150" height="160" rx="8"/>
  <text x="725" y="96" text-anchor="middle" class="label">LED strip</text>
  <text x="725" y="112" text-anchor="middle" class="small">start of row 1</text>
  <text x="658" y="140" class="small">DIN</text>
  <text x="658" y="180" class="small">+5V</text>
  <text x="658" y="210" class="small">GND</text>

  <!-- Supply -->
  <rect class="block" x="300" y="330" width="160" height="90" rx="8"/>
  <text x="380" y="378" text-anchor="middle" class="label">5 V supply (10 A)</text>
  <text x="380" y="396" text-anchor="middle" class="small">enclosed plug-in brick</text>
  <text x="452" y="352" text-anchor="end" class="small">+5 V</text>
  <text x="452" y="410" text-anchor="end" class="small">GND (&#8722;)</text>

  <!-- DATA wires (green) -->
  <path class="grn" d="M 210 130 L 300 130"/>
  <text x="255" y="122" text-anchor="middle" class="small">3.3 V data</text>
  <path class="grn" d="M 460 135 L 510 135"/>
  <path class="grn" d="M 570 135 L 650 135"/>
  <text x="610" y="127" text-anchor="middle" class="small">5 V data</text>

  <!-- +5 V (red): supply -> fuse -> rail -> strip and level shifter -->
  <path class="red" d="M 460 346 L 500 346"/>
  <rect class="part" x="500" y="336" width="44" height="20" rx="4"/>
  <text x="522" y="330" text-anchor="middle" class="small">fuse</text>
  <path class="red" d="M 544 346 L 590 346 L 590 175 L 650 175"/>
  <path class="red" d="M 590 175 L 460 175"/>
  <circle cx="590" cy="175" r="4" fill="#cf222e"/>

  <!-- capacitor across the rails: + plate on the red rail, - plate on the black rail -->
  <path class="red" d="M 590 270 L 604 270"/>
  <path class="blk" d="M 616 270 L 630 270"/>
  <line x1="604" y1="256" x2="604" y2="284" stroke="#cf222e" stroke-width="3"/>
  <line x1="616" y1="256" x2="616" y2="284" stroke="#1f2328" stroke-width="3"/>
  <circle cx="590" cy="270" r="4" fill="#cf222e"/>
  <text x="654" y="262" class="small">1000 &#181;F capacitor</text>
  <text x="654" y="278" class="small">+ leg to the red wire,</text>
  <text x="654" y="294" class="small">stripe (&#8722;) to the black</text>

  <!-- GND (black): common bus -->
  <path class="blk" d="M 460 405 L 630 405 L 630 205 L 650 205"/>
  <circle cx="630" cy="282" r="4" fill="#1f2328"/>
  <circle cx="480" cy="405" r="4" fill="#1f2328"/>
  <path class="blk" d="M 480 405 L 480 455 L 250 455 L 250 155 L 300 155"/>
  <path class="blk" d="M 210 205 L 300 205"/>
  <circle cx="250" cy="205" r="4" fill="#1f2328"/>
  <text x="262" y="474" class="small">common ground: supply &#8722;, Pi, level shifter and strip all joined</text>

  <!-- legend -->
  <g class="small">
    <line x1="30" y1="504" x2="70" y2="504" stroke="#cf222e" stroke-width="3"/><text x="78" y="508">+5 V (power)</text>
    <line x1="200" y1="504" x2="240" y2="504" stroke="#1f2328" stroke-width="3"/><text x="248" y="508">ground (GND)</text>
    <line x1="380" y1="504" x2="420" y2="504" stroke="#1a7f37" stroke-width="3"/><text x="428" y="508">data</text>
    <text x="480" y="508">Wire colours are only a habit: follow the labels.</text>
  </g>
</svg>
