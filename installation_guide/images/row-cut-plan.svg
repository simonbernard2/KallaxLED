<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">Cut plan: two reels of 150 LEDs into pieces of 50</title>
  <desc id="d">Reel 1 is cut into three pieces of 50 LEDs for rows 1, 2 and 3 (stage 1). Reel 2 is cut into two pieces for rows 4 and 5 (stage 2) plus one spare.</desc>
  <rect width="760" height="330" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .small { font-size: 12px; }
    .label { font-size: 14px; font-weight: 600; }
    .title { font-size: 18px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="leds" width="4.533" height="40" patternUnits="userSpaceOnUse">
      <rect x="0.7" y="12" width="3" height="16" fill="#8c959f"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2328"/></marker>
  </defs>
  <text x="380" y="26" text-anchor="middle" class="title">Cut plan: 50 LEDs per row</text>

  <!-- Reel 1 -->
  <text x="40" y="62" class="label">Reel 1 (150 LEDs): Stage 1</text>
  <rect x="40" y="72" width="680" height="40" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <rect x="40" y="72" width="680" height="40" fill="url(#leds)"/>
  <rect x="40" y="72" width="226.7" height="40" fill="#0969da" fill-opacity="0.18"/>
  <rect x="266.7" y="72" width="226.7" height="40" fill="#0969da" fill-opacity="0.32"/>
  <rect x="493.4" y="72" width="226.6" height="40" fill="#0969da" fill-opacity="0.18"/>
  <g stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4">
    <line x1="266.7" y1="62" x2="266.7" y2="130"/><line x1="493.4" y1="62" x2="493.4" y2="130"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="153" y="132">Row 1: LEDs 0 to 49</text>
    <text x="380" y="132">Row 2: LEDs 50 to 99</text>
    <text x="607" y="132">Row 3: LEDs 100 to 149</text>
  </g>

  <!-- Reel 2 -->
  <text x="40" y="182" class="label">Reel 2 (150 LEDs): Stage 2</text>
  <rect x="40" y="192" width="680" height="40" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <rect x="40" y="192" width="680" height="40" fill="url(#leds)"/>
  <rect x="40" y="192" width="226.7" height="40" fill="#bc4c00" fill-opacity="0.18"/>
  <rect x="266.7" y="192" width="226.7" height="40" fill="#bc4c00" fill-opacity="0.32"/>
  <rect x="493.4" y="192" width="226.6" height="40" fill="#8c959f" fill-opacity="0.2"/>
  <g stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4">
    <line x1="266.7" y1="182" x2="266.7" y2="250"/><line x1="493.4" y1="182" x2="493.4" y2="250"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="153" y="252">Row 4: LEDs 150 to 199</text>
    <text x="380" y="252">Row 5: LEDs 200 to 249</text>
    <text x="607" y="252">Spare piece (50 LEDs)</text>
  </g>

  <!-- direction -->
  <line x1="40" y1="290" x2="260" y2="290" stroke="#1f2328" stroke-width="2" marker-end="url(#arr)"/>
  <text x="270" y="294" class="small">Data direction: follow the arrows printed on the strip (DIN to DO).</text>
  <line x1="266.7" y1="310" x2="290" y2="310" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="298" y="314" class="small">Cut line: cut only on the printed line between two LEDs, across the copper pads.</text>
</svg>
