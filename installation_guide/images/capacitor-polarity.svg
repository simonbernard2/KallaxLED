<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" role="img" aria-labelledby="t d">
  <title id="t">Electrolytic capacitor polarity</title>
  <desc id="d">The stripe on the can marks the negative leg, and the longer leg is positive. The negative leg goes to ground and the positive leg to +5 V.</desc>
  <rect width="560" height="270" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 13px; }
    .title { font-size: 18px; font-weight: 700; }
    .label { font-weight: 600; }
  </style>
  <text x="280" y="28" text-anchor="middle" class="title">Which way round does the capacitor go?</text>
  <rect x="220" y="50" width="120" height="110" rx="10" fill="#d0d7de" stroke="#1f2328" stroke-width="2"/>
  <rect x="220" y="50" width="34" height="110" rx="10" fill="#8c959f" stroke="#1f2328" stroke-width="2"/>
  <g font-size="22" font-weight="700" text-anchor="middle"><text x="237" y="90" style="font-size:22px">&#8722;</text><text x="237" y="120" style="font-size:22px">&#8722;</text><text x="237" y="150" style="font-size:22px">&#8722;</text></g>
  <text x="290" y="110" text-anchor="middle" class="label">1000 &#181;F</text>
  <!-- legs -->
  <line x1="238" y1="160" x2="238" y2="205" stroke="#1f2328" stroke-width="3"/>
  <line x1="322" y1="160" x2="322" y2="235" stroke="#1f2328" stroke-width="3"/>
  <text x="228" y="206" text-anchor="end" class="label">&#8722; short leg</text>
  <text x="228" y="224" text-anchor="end">goes to ground (black)</text>
  <text x="336" y="226" class="label">+ long leg</text>
  <text x="336" y="244">goes to +5 V (red)</text>
  <text x="150" y="100" text-anchor="middle">stripe with &#8722; signs</text>
  <text x="150" y="118" text-anchor="middle">marks the minus side</text>
  <line x1="196" y1="105" x2="220" y2="105" stroke="#1f2328" stroke-width="1.5"/>
  <text x="440" y="90" text-anchor="middle" style="fill:#cf222e" class="label">Wrong way round can</text>
  <text x="440" y="108" text-anchor="middle" style="fill:#cf222e" class="label">overheat and pop.</text>
</svg>
