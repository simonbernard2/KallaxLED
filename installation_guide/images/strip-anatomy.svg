<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a WS2812B strip piece</title>
  <desc id="d">A strip piece with LEDs along its length, an arrow showing the data direction, three copper pads at each end (+5V, data, ground) and cut lines between LEDs.</desc>
  <rect width="800" height="300" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 13px; }
    .title { font-size: 18px; font-weight: 700; }
    .label { font-weight: 600; }
    .small { font-size: 12px; }
  </style>
  <defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2328"/></marker></defs>
  <text x="400" y="28" text-anchor="middle" class="title">One strip piece (not to scale)</text>

  <!-- strip body -->
  <rect x="60" y="110" width="680" height="52" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <g fill="#fff8c5" stroke="#6e7781" stroke-width="1.5">
    <rect x="150" y="122" width="28" height="28"/><rect x="230" y="122" width="28" height="28"/><rect x="310" y="122" width="28" height="28"/><rect x="390" y="122" width="28" height="28"/><rect x="470" y="122" width="28" height="28"/><rect x="550" y="122" width="28" height="28"/><rect x="630" y="122" width="28" height="28"/>
  </g>
  <!-- cut lines -->
  <g stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4">
    <line x1="116" y1="96" x2="116" y2="176"/><line x1="196" y1="96" x2="196" y2="176"/><line x1="276" y1="96" x2="276" y2="176"/><line x1="356" y1="96" x2="356" y2="176"/><line x1="436" y1="96" x2="436" y2="176"/><line x1="516" y1="96" x2="516" y2="176"/><line x1="596" y1="96" x2="596" y2="176"/><line x1="676" y1="96" x2="676" y2="176"/>
  </g>
  <text x="196" y="92" text-anchor="middle" class="small" style="fill:#cf222e">cut lines: one between every two LEDs</text>

  <!-- pads left (input end) -->
  <g fill="#d4a017" stroke="#6e7781" stroke-width="1">
    <rect x="66" y="118" width="12" height="10"/><rect x="66" y="132" width="12" height="10"/><rect x="66" y="146" width="12" height="10"/>
  </g>
  <text x="60" y="190" class="small label">INPUT end (start of the piece)</text>
  <text x="60" y="206" class="small">three pads: +5V, DIN (data in), GND</text>
  <text x="60" y="222" class="small">VERIFY the order printed on your strip</text>

  <!-- pads right (output end) -->
  <g fill="#d4a017" stroke="#6e7781" stroke-width="1">
    <rect x="722" y="118" width="12" height="10"/><rect x="722" y="132" width="12" height="10"/><rect x="722" y="146" width="12" height="10"/>
  </g>
  <text x="740" y="190" text-anchor="end" class="small label">OUTPUT end</text>
  <text x="740" y="206" text-anchor="end" class="small">+5V, DO (data out), GND</text>

  <!-- arrow -->
  <line x1="250" y1="64" x2="560" y2="64" stroke="#1f2328" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="405" y="50" text-anchor="middle" class="small label">data direction: follow the arrows printed on the strip</text>

  <text x="400" y="268" text-anchor="middle" class="small">Data only flows one way. A piece wired backwards (output end to the Pi) shows nothing.</text>
</svg>
