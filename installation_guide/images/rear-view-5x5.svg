<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" role="img" aria-labelledby="t d">
  <title id="t">Kallax 5 by 5, strips on the rear edges, as seen from the front</title>
  <desc id="d">X-ray view from the front of the shelf. Five row strips of 50 LEDs run along the rear bottom edge of each row, chained in a serpentine from the bottom row to the top row. Rows 1 to 3 are stage 1, rows 4 and 5 are stage 2.</desc>
  <rect width="760" height="760" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .small { font-size: 12px; }
    .label { font-size: 14px; font-weight: 600; }
    .title { font-size: 18px; font-weight: 700; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 2; }
    .s1 { stroke: #0969da; stroke-width: 7; stroke-linecap: round; fill: none; }
    .s2 { stroke: #bc4c00; stroke-width: 7; stroke-linecap: round; fill: none; stroke-dasharray: 14 6; }
    .j1 { stroke: #0969da; stroke-width: 3; fill: none; }
    .j2 { stroke: #bc4c00; stroke-width: 3; fill: none; stroke-dasharray: 8 5; }
    .data { stroke: #1a7f37; stroke-width: 3; fill: none; }
  </style>
  <text x="380" y="26" text-anchor="middle" class="title">Front view, looking through the shelf at the strips behind it</text>

  <!-- column headings -->
  <g class="label" text-anchor="middle">
    <text x="145" y="52">col 1</text><text x="265" y="52">col 2</text><text x="385" y="52">col 3</text><text x="505" y="52">col 4</text><text x="625" y="52">col 5</text>
  </g>

  <!-- boxes: row 5 at top (y=60) to row 1 at bottom (y=540) -->
  <g class="box">
    <rect x="90" y="60" width="110" height="110"/><rect x="210" y="60" width="110" height="110"/><rect x="330" y="60" width="110" height="110"/><rect x="450" y="60" width="110" height="110"/><rect x="570" y="60" width="110" height="110"/>
    <rect x="90" y="180" width="110" height="110"/><rect x="210" y="180" width="110" height="110"/><rect x="330" y="180" width="110" height="110"/><rect x="450" y="180" width="110" height="110"/><rect x="570" y="180" width="110" height="110"/>
    <rect x="90" y="300" width="110" height="110"/><rect x="210" y="300" width="110" height="110"/><rect x="330" y="300" width="110" height="110"/><rect x="450" y="300" width="110" height="110"/><rect x="570" y="300" width="110" height="110"/>
    <rect x="90" y="420" width="110" height="110"/><rect x="210" y="420" width="110" height="110"/><rect x="330" y="420" width="110" height="110"/><rect x="450" y="420" width="110" height="110"/><rect x="570" y="420" width="110" height="110"/>
    <rect x="90" y="540" width="110" height="110"/><rect x="210" y="540" width="110" height="110"/><rect x="330" y="540" width="110" height="110"/><rect x="450" y="540" width="110" height="110"/><rect x="570" y="540" width="110" height="110"/>
  </g>

  <!-- row headings -->
  <g class="label" text-anchor="start">
    <text x="6" y="120" dominant-baseline="middle">row 5</text>
    <text x="6" y="240" dominant-baseline="middle">row 4</text>
    <text x="6" y="360" dominant-baseline="middle">row 3</text>
    <text x="6" y="480" dominant-baseline="middle">row 2</text>
    <text x="6" y="600" dominant-baseline="middle">row 1</text>
  </g>

  <!-- strips: each lies along the rear bottom edge of its row (stripe y = box bottom + 5) -->
  <!-- row 1: left to right -->
  <path class="s1" d="M 92 655 L 650 655"/>
  <path class="j1" d="M 650 655 L 705 655 L 705 535 L 650 535"/>
  <!-- row 2: right to left -->
  <path class="s1" d="M 650 535 L 92 535"/>
  <path class="j1" d="M 92 535 L 66 535 L 66 415 L 92 415"/>
  <!-- row 3: left to right -->
  <path class="s1" d="M 92 415 L 650 415"/>
  <path class="j2" d="M 650 415 L 705 415 L 705 295 L 650 295"/>
  <!-- row 4: right to left (stage 2) -->
  <path class="s2" d="M 650 295 L 92 295"/>
  <path class="j2" d="M 92 295 L 66 295 L 66 175 L 92 175"/>
  <!-- row 5: left to right (stage 2) -->
  <path class="s2" d="M 92 175 L 650 175"/>

  <!-- LED numbers -->
  <g class="small" text-anchor="middle">
    <text x="371" y="640">Row 1: LEDs 0 to 49  &#8594;</text>
    <text x="371" y="520">&#8592;  Row 2: LEDs 50 to 99</text>
    <text x="371" y="400">Row 3: LEDs 100 to 149  &#8594;</text>
    <text x="371" y="280">&#8592;  Row 4: LEDs 150 to 199</text>
    <text x="371" y="160">Row 5: LEDs 200 to 249  &#8594;</text>
  </g>

  <!-- power taps: required tap at the LEFT end of every row (start of rows 1, 3, 5; finish of rows 2, 4); optional tap at the right end -->
  <g stroke="#cf222e" stroke-width="3">
    <circle cx="96" cy="655" r="7" fill="#cf222e"/>
    <circle cx="96" cy="535" r="7" fill="#cf222e"/>
    <circle cx="96" cy="415" r="7" fill="#cf222e"/>
    <circle cx="96" cy="295" r="7" fill="#cf222e"/>
    <circle cx="96" cy="175" r="7" fill="#cf222e"/>
    <g fill="#ffffff">
      <circle cx="646" cy="655" r="7"/><circle cx="646" cy="535" r="7"/><circle cx="646" cy="415" r="7"/><circle cx="646" cy="295" r="7"/><circle cx="646" cy="175" r="7"/>
    </g>
  </g>

  <!-- controller -->
  <rect x="90" y="685" width="260" height="56" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="220" y="709" text-anchor="middle" class="label">Controller box</text>
  <text x="220" y="727" text-anchor="middle" class="small">Pi, level shifter, resistor, capacitor</text>
  <path class="data" d="M 130 685 L 130 668 L 96 668 L 96 662"/>
  <text x="104" y="680" class="small" fill="#1a7f37" style="fill:#1a7f37">data</text>

  <!-- legend -->
  <g class="small">
    <path class="s1" d="M 400 700 L 450 700"/><text x="460" y="704">Stage 1: rows 1 to 3 (reel 1, LEDs 0 to 149)</text>
    <path class="s2" d="M 400 722 L 450 722"/><text x="460" y="726">Stage 2: rows 4 and 5 (reel 2, LEDs 150 to 249)</text>
    <circle cx="410" cy="745" r="6" fill="#cf222e" stroke="#cf222e" stroke-width="2"/><text x="422" y="749">power tap (required, all on the left)</text>
    <circle cx="570" cy="745" r="6" fill="#ffffff" stroke="#cf222e" stroke-width="2"/><text x="582" y="749">extra tap (only if the floor test says so)</text>
  </g>
</svg>
